[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cn5-research-cos"
version = "0.1.0"
description = "Deterministic LangGraph research convergence loop (Chief-of-Staff research cockpit) — Phase 1 spine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=1",
    "typer>=0.12",
    "rich>=13",
    # P2a SOT clarification front-end:
    #   cn5-ask : the reusable iterate-until-converged engine (skill-cn5-ask).
    #             Installed editable from D:/D-claude/skills/skill-cn5-ask;
    #             `import cn5_ask`. Declared here so the dependency is explicit.
    "cn5-ask",
    #   claude-agent-sdk / tenacity : the narrow LLM step + retry/backoff.
    "claude-agent-sdk>=0.1",
    "tenacity>=8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
cos = "cn5_research_cos.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cn5_research_cos.sot.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -p no:faker: the `faker` pytest plugin (not used by this project) imports faker
# at collection, which calls platform.win32_ver() -> WMI and can deadlock pytest
# collection on Windows/Python 3.12 when the WMI service stalls. Disabling the
# unused plugin avoids the hang with no platform monkeypatching.
addopts = "-ra -p no:faker"
markers = [
    "llm: live LLM test; requires ANTHROPIC_API_KEY (skipped without a key)",
]
